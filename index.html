
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travel Explorer</title>

    <!-- CSS FILE -->

    <link rel="stylesheet" href="style.css">

    <!-- LEAFLET CSS -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

</head>

<body>

    <!-- HEADER -->

    <header>

        <h1>🌍 Travel Explorer</h1>

        <p>
            Search any place and explore nearby attractions,
            hotels and restaurants
        </p>

    </header>


    <!-- SEARCH SECTION -->

    <section class="search-section">

        <h2>Where do you want to travel?</h2>

        <div class="search-box">

            <!-- LOCATION INPUT -->

            <input
                type="text"
                id="placeInput"
                placeholder="Search any place..."
            >

            <!-- NUMBER OF DAYS INPUT -->

            <input
                type="number"
                id="daysInput"
                placeholder="Days"
                min="1"
                max="30"
                value="3"
            >

            <!-- SEARCH BUTTON -->

            <button onclick="searchPlace()">

                Search

            </button>

        </div>

    </section>


    <!-- LOADING -->

    <div id="loading" class="loading">

        Searching...

    </div>


    <!-- RESULTS -->

    <main id="result">

        <div class="welcome">

            <h2>🌎 Explore the World</h2>

            <p>

                Enter any city, tourist destination,
                landmark or location above.

            </p>

        </div>

    </main>


    <!-- MAP -->

    <div id="map"></div>


    <!-- FOOTER -->

    <footer>

        <p>

            Travel Explorer © 2026

        </p>

    </footer>


    <!-- LEAFLET JAVASCRIPT -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <!-- CUSTOM JAVASCRIPT -->

    <script src="script.js"></script>


</body>

</html>
